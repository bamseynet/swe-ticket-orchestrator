# Declared-files check (D0-10): a PR may touch only the files its issue declares.
#
# Its own workflow, not a job in ci.yml, because it must also run on `labeled`, `unlabeled` and
# `edited` (an override label, a fixed `Closes #N`), and those triggers would re-run all of CI.
# The `scope` job is a SECOND required check (deploy/ruleset-main.json), next to `ci-required`.
#
# Security: `pull_request_target`, so GitHub runs THIS file as it is on the base branch and a PR
# cannot rewrite the step to switch the check off. That is only safe because the job never
# checks out or runs PR code: it checks out the BASE commit, reads the changed-file list through
# the API, has a read-only token and no secrets. Never add a checkout of the PR head ref or sha.
# Declared files come from docs/STAGES.md at the base commit, read through the API. Because the
# base copy runs, a PR that edits this file or scripts/check_scope.py is not checked by its own
# version; the script fails any such PR unless a listed human applied the override label.
# Override actors: repo variable SCOPE_OVERRIDE_ACTORS (comma-separated logins; empty means no
# override is possible).
name: Scope

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Declared-files check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE_OVERRIDE_ACTORS: ${{ vars.SCOPE_OVERRIDE_ACTORS }}
        run: |
          # Bootstrap only: skip while the base commit has no script (the PR that adds it).
          if [ ! -f scripts/check_scope.py ]; then
            echo "scripts/check_scope.py is not on the base branch yet; skipping (bootstrap)"
            exit 0
          fi
          python3 scripts/check_scope.py
