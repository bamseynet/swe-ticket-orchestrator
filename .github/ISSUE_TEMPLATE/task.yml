name: Task
description: A unit of work, sized for one PR (normally generated from docs/STAGES.md)
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Backlog issues are generated by `tools/backlog/sync_issues.py` from `docs/STAGES.md`. Edit the spec there for planned work.
  - type: input
    id: issue_id
    attributes:
      label: Issue ID
      description: The ID in docs/STAGES.md.
      placeholder: D0-06
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Delivery stage
      options: [D0, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Standing criteria in docs/STAGES.md also apply.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: The declared files, plus their tests.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: S is under about 300 changed lines, M 300 to 800, L 800 to 1,500. Nothing larger.
      options: [S, M, L]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      description: Serial if it touches a shared file.
      options: [parallel, serial]
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: Depends on
