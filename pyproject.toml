[project]
name = "sto"
version = "0.0.0"
description = "Orchestrator-workers platform for SWE tickets, with configurable stages and human gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0.3",
    "strands-agents~=1.63",
    "cryptography>=42",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261030",
]
# CI-only (ui-browser job): `uv sync --locked --group browser`. Not a default group.
browser = [
    "playwright==1.55.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
addopts = ["-p", "hermetic_guard", "-p", "tier_guard", "-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["sto", "tools", "scripts"]
omit = ["*/tests/*", "*/tools/*/test_*.py"] # test files cover themselves; scripts/test_changed.py is code
branch = true

[tool.coverage.report]
# Measured at about 61% on the code that exists today (sto has no statements yet; the gap is
# tools/backlog/sync_issues.py). The floor sits just under it and is ratcheted up as code
# lands. Per-package floors (engine, gates, effects, budget highest) arrive with those packages.
fail_under = 58
