[project]
name = "sto"
version = "0.0.0"
description = "Orchestrator-workers platform for SWE tickets, with configurable stages and human gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
addopts = ["-p", "hermetic_guard", "-p", "tier_guard", "-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["sto"]
branch = true

[tool.coverage.report]
# Global floor for now. Per-package floors (engine, gates, effects, budget highest) are added
# with those packages.
fail_under = 90
