[project]
name = "sto"
version = "0.0.0"
description = "Orchestrator-workers platform for SWE tickets, with configurable stages and human gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
addopts = ["-p", "hermetic_guard", "-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
pythonpath = ["src", "tests"]
